name: tinyasr
version: 0.3.0
slug: tinyasr
description: Light speech to text for Assist with tinyasr (en, ru, uk, es, it, pt, fa, km, uz)
url: https://github.com/nemethhh/tinyasr-wyoming
arch:
  - amd64
  - aarch64
image: ghcr.io/nemethhh/{arch}-addon-tinyasr
init: false
startup: services
discovery:
  - wyoming
hassio_api: true
map:
  - type: share
    read_only: true
  - type: media
    read_only: true
watchdog: tcp://[HOST]:10300
options:
  model: en-ru-uk
  mode: whole
  beam: 1
  threads: 0
  end_of_speech: tinyasr
  min_pause_seconds: 0.7
  max_pause_seconds: 1.25
  no_speech_seconds: 8
  max_seconds: 30
  wake_words:
    - alexa
    - алекса
    - echo
    - эхо
    - computer
    - компьютер
    - amazon
    - амазон
    - ziggy
  debug_logging: false
schema:
  model: list(en-ru-uk|en-es-it-pt|en-fa|en-km|uz|custom)
  custom_model: str?
  mode: list(whole|live)
  beam: int(1,8)
  threads: int(0,8)
  end_of_speech: list(tinyasr|home_assistant)
  min_pause_seconds: float(0.3,3)
  max_pause_seconds: float(0.5,5)
  no_speech_seconds: int(2,30)
  max_seconds: int(5,120)
  wake_words:
    - str
  debug_logging: bool
